name: Deploy to Server

# Manual only. This used to fire on every push to main and run git pull + pm2 restart
# on the VM with no review gate; on 2026-09-04 that deployed the Postgres migration to
# a VM with no DATABASE_URL and took the site down. Run it from the Actions tab once
# the VM's .env is ready. Re-enable `push: branches: [main]` here when the docker
# deploy has proven itself.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Deploy to server via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd /home/ubuntu/AIRTC
          ./deploy.sh
